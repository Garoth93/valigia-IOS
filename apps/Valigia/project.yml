# XcodeGen spec. The .xcodeproj is generated in CI with `xcodegen generate`
# and is never committed.
#
name: Valigia

options:
  bundleIdPrefix: com.garoth93
  deploymentTarget:
    iOS: "26.0"   # iPhone dell'utente: iOS 26+; SDK del runner: iOS 26.5 (Xcode 26.6)
  xcodeVersion: "26.6"
  createIntermediateGroups: true
  generateEmptyDirectories: true

packages:
  ValigiaCore:
    path: ../../packages/ValigiaCore

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"
    TARGETED_DEVICE_FAMILY: "1"          # iPhone only
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    # Signing is empty here on purpose:
    # - testflight.yml overrides it on the command line (Automatic, team from
    #   the APPLE_TEAM_ID secret, profiles via the App Store Connect API key);
    # - build-ipa.yml (Sideloadly fallback) builds with CODE_SIGNING_ALLOWED=NO
    #   and ad-hoc signs with Valigia.sideload.entitlements / Widgets.entitlements.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: ""
    DEVELOPMENT_TEAM: ""
    PROVISIONING_PROFILE_SPECIFIER: ""
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  Valigia:
    type: application
    platform: iOS
    # Tells Xcode's automatic signing which capabilities the App ID needs.
    attributes:
      SystemCapabilities:
        com.apple.ApplicationGroups.iOS:
          enabled: 1
    sources:
      - path: Sources
      - path: Shared
      - path: Resources
    dependencies:
      - package: ValigiaCore
        product: ValigiaCore
      - target: ValigiaWidgets
        embed: true
      - sdk: UserNotifications.framework
      - sdk: PhotosUI.framework
      - sdk: Charts.framework
      - sdk: RealityKit.framework
      - sdk: QuickLook.framework
      - sdk: QuickLookThumbnailing.framework
      - sdk: VisionKit.framework
      - sdk: LocalAuthentication.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.garoth93.valigia
        PRODUCT_NAME: Valigia
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Valigia.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: Info.plist   # generated by XcodeGen from the properties below (git-ignored)
      properties:
        CFBundleDisplayName: Valigia
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: it
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # Portrait only: App Store validation (error 90474) requires full screen.
        UIRequiresFullScreen: true
        UIApplicationSupportsIndirectInputEvents: true
        ITSAppUsesNonExemptEncryption: false
        LSRequiresIPhoneOS: true
        NSCameraUsageDescription: "Valigia usa la fotocamera per fotografare o scansionare documenti e oggetti da allegare alle voci e ai viaggi. Restano sul tuo iPhone."
        NSFaceIDUsageDescription: "Valigia usa Face ID, se lo attivi nelle Impostazioni, per proteggere i documenti allegati (biglietti, documenti d'identità)."
        NSPhotoLibraryUsageDescription: "Valigia apre solo le foto che scegli, per allegarle a una voce o a un viaggio. Nulla lascia il tuo iPhone."
        VLAppGroup: group.com.garoth93.valigia
        CFBundleURLTypes:
          - CFBundleURLName: com.garoth93.valigia
            CFBundleURLSchemes:
              - valigia

  ValigiaWidgets:
    type: app-extension
    platform: iOS
    attributes:
      SystemCapabilities:
        com.apple.ApplicationGroups.iOS:
          enabled: 1
    sources:
      - path: Widgets
      - path: Shared
    dependencies:
      - package: ValigiaCore
        product: ValigiaCore
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.garoth93.valigia.widgets
        PRODUCT_NAME: ValigiaWidgets
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Widgets.entitlements
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) WIDGET_EXTENSION"
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
    info:
      path: Widgets-Info.plist   # generated by XcodeGen (git-ignored)
      properties:
        CFBundleDisplayName: Valigia
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: it
        VLAppGroup: group.com.garoth93.valigia
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

schemes:
  Valigia:
    build:
      targets:
        Valigia: all
        ValigiaWidgets: all
    run:
      config: Debug
    archive:
      config: Release
